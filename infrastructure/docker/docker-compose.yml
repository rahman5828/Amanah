services:
  postgres:
    image: postgres:17
    container_name: amanah-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: amanah
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: amanah_db

    ports:
      - "5432:5432"

    volumes:
      - amanah_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amanah -d amanah_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  amanah_postgres_data:
  